# BNF 25일선 이격도 백테스트 설정. 모든 파라미터는 여기서만 바꾼다.

data:
  start: "2008-01-01"        # 신호를 세는 첫날. 네이버가 상장폐지 종목 시세를 2008년 무렵부터 준다
  warmup_start: "2007-01-01" # 지수 120일선 계산용으로 더 앞서 받는 날
  end: null                  # null 이면 최근 거래일까지
  dir: ../krx_data          # 시세 폴더. 저장소 밖에 두고 여러 알고리즘이 같이 쓴다. 환경변수 KRX_DATA_DIR 가 있으면 그쪽
  request_delay: 0.3         # 요청 사이 지연(초). 0.3 이상
  markets: [KOSPI, KOSDAQ]

universe:
  min_listing_days: 25       # 상장 후 이 거래일 수 미만 구간은 신호 제외
  min_avg_value: 1.0e+9      # 20일 평균 거래대금 하한(원)
  avg_value_window: 20
  # 이름이 이 정규식에 걸리면 제외. "9호" 같은 이름은 선박투자회사다. ETF/ETN 은 주식 목록에 원래 없다
  exclude_name_patterns: ["스팩", "리츠", '\d+호$']
  exclude_preferred: true    # 종목코드 끝자리가 0 이 아니면 우선주로 보고 제외
  # 상장폐지 종목의 마지막 N 거래일(정리매매 7일)에는 신호를 내지 않는다. 정리매매는 그때 이미 공시된 사실이다.
  # 이미 들고 있던 종목은 이 기간에도 청산 규칙대로 판다.
  delisting_sale_days: 7
  # 하루에 이보다 더 떨어지면(가격 제한 30% 초과) 시세가 수정되지 않은 끊김으로 보고
  # 그날부터 25거래일(25일선이 새 가격으로 다 바뀔 때까지) 신호를 막는다. null 이면 끈다
  price_break_drop: -0.30
  price_break_drop_pre_2015: -0.16   # 2015-06-15 전에는 가격 제한이 ±15% 였다
  # 거래정지가 이 거래일 수보다 길었다가 풀리면 그날부터 25거래일 신호를 막는다.
  # 재상장 기준가가 새로 잡혀 25일선이 옛 가격과 섞이기 때문이다 (예: 036220 은 5,450 원에서 2,180 원으로 다시 시작)
  long_halt_days: 3
  # 긴 거래정지 뒤 재개일에 절반 넘게 빠지거나 두 배 넘게 오르면, 또는 가격 제한을 넘게 움직이면
  # 시세가 수정되지 않은 끊김으로 본다. 그 날을 끼고 들고 있던 거래는 결과에서 뺀다 (정리매매 기간은 예외)
  resume_gap_break: 0.5

indicators:
  ma_window: 25
  index_ma_window: 120       # 시장 국면 필터: 지수 종가 > 지수 120일선
  index_disparity_crash: 97  # 신호일 지수 이격도(25일선) 이 값 이하면 "시장 동반 급락"

rules:
  entry_on_signal_close: false  # true 면 신호일 종가 매수 (미래 정보 논란, 기본 끔)
  target_exit_on_close: false   # true 면 종가가 MA25 회복한 날 종가 청산, false 면 다음 날 시가
  # 보유일은 진입일을 1일째로 센 거래일 수다. 거래정지일도 센다.

costs:
  buy_fee: 0.00015
  sell_fee: 0.00015
  sell_tax: 0.0020           # 2026-01-01 부터 코스피(거래세 0.05% + 농특세 0.15%)·코스닥 모두 0.20%
  # 매도일 기준 세율. 코스피(거래세+농특세)와 코스닥 합계가 해마다 같아서 하나로 쓴다. 없으면 sell_tax 하나만 쓴다
  sell_tax_schedule:
    - ["2000-01-01", 0.0030]
    - ["2019-05-30", 0.0025]
    - ["2021-01-01", 0.0023]
    - ["2023-01-01", 0.0020]
    - ["2024-01-01", 0.0018]
    - ["2025-01-01", 0.0015]
    - ["2026-01-01", 0.0020]
  slippage: 0.001            # 편도

grid:
  thresholds: [95, 90, 85, 80, 75, 70]
  stops: [null, -0.05, -0.08, -0.12]
  holds: [3, 5, 10, 20]
  # 시장 필터. none = 없음, uptrend = 지수 종가 > 지수 120일선,
  # crashNN = 신호일 지수 이격도(25일선) <= NN 일 때만 (시장 동반 급락). crash 만 쓰면 index_disparity_crash 값
  market_filter: [none, uptrend, crash95, crash97, crash99]
  markets: [KOSPI, KOSDAQ, ALL]
  workers: 6                 # 종목별 병렬 처리 프로세스 수

stage2:
  top_n: 5
  min_trades: 200            # 기대값 순위를 매길 때 거래 수가 이보다 적은 조합은 뺀다
  initial_capital: 100000000
  max_positions: 5
  # 이 조합 하나를 시장 필터마다 포트폴리오로 돌려 필터끼리 비교한다
  compare_combo: {market: KOSPI, threshold: 70, stop: -0.08, hold: 20}
  # 손절로 판 종목은 이 거래일 수만큼 다시 사지 않는다. 0 은 설계서 그대로(제한 없음). compare_combo 에만 적용해 비교한다
  reentry_cooldowns: [0, 20, 60, 120]
  # 폭락일에 자리 늘리기. [보통 자리, 폭락일 자리]. 폭락일 자리가 0 이면 늘리지 않는다.
  # 폭락일 = 신호일 지수 이격도(25일선) <= crash_slots_level. 폭락일 신호는 평가금액의 1/폭락일 자리 만큼 산다
  # compare_combo 에만 적용하고, slot_cooldowns 의 재진입 제한마다 돌린다
  slot_variants: [[5, 0], [5, 10], [5, 20], [5, 40], [10, 0], [20, 0]]
  crash_slots_level: 95
  slot_cooldowns: [0, 120]
  train_end: "2016-12-31"    # 학습 2008~2016 (9년), 검증 2017~ (약 9.7년)    # 학습 기간 끝. 검증은 그다음 날부터
  crash_periods:
    "2008-10 금융위기": ["2008-09-15", "2008-11-30"]
    "2011-08 급락": ["2011-08-01", "2011-09-30"]
    "2020-03 코로나": ["2020-02-20", "2020-03-31"]
    "2022 하락장": ["2022-01-01", "2022-12-31"]
    "2024-08 급락": ["2024-08-01", "2024-08-31"]
    "2026-06~08 급락": ["2026-06-01", "2026-08-31"]

report:
  top_n: 10
