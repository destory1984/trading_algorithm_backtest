# 변동성 목표 과거 검증 설정. 모든 값은 여기에만 둔다. 지시서 SPEC.md. 결과를 보기 전에 적었다.

data:
  hist_dir: ../../hist_data  # ^GSPC 를 받아 두는 곳. 환경변수 HIST_DATA_DIR 가 있으면 그쪽
  symbol: "^GSPC"
  file: GSPC.parquet
  fetch_start: "1927-01-01"
  fetch_end: "2007-01-01"    # 이 날 전까지만 요청한다(yfinance end 는 그날을 빼고 준다)
  start: "1928-02-01"        # 곡선 첫날
  end: "2006-12-29"          # 봉인선. 불러온 직후 이 날 뒤를 잘라낸다
  eras:                      # 기준 4
    "1928 → 1949": ["1928-02-01", "1949-12-31"]
    "1950 → 1969": ["1950-01-01", "1969-12-31"]
    "1970 → 1989": ["1970-01-01", "1989-12-31"]
    "1990 → 2006": ["1990-01-01", "2006-12-31"]

cost: 0.0012                 # 편도: 지금 SPY 와 같다
dividend: 0.04               # 본 가정: 연 배당, 달력 날짜로 쌓는다
cash: 0.0                    # 본 가정: 현금 연 수익
sens:                        # 민감도(판정 제외, 판정이 바뀌면 "가정에 달림")
  배당 0%: {dividend: 0.0, cash: 0.0}
  현금 3.8%: {dividend: 0.04, cash: 0.038}

rule:                        # index_timing SPEC 3절 T3 그대로
  main: 0.15
  neighbors: [0.12, 0.18]
  vol_window: 20
  band: 0.10

pass:                        # index_timing SPEC 6절과 같은 수
  mdd_ratio: 0.70
  cagr_gap: 0.015
  era_cagr_gap: 0.03
  trades_per_year: 12

stress:
  after_days: 63
  windows:
    1929 → 32 대공황: ["1929-09-01", "1932-07-31"]
    1937 → 38 하락: ["1937-03-01", "1938-03-31"]
    1940 서부전선: ["1940-04-01", "1940-06-30"]
    1946 하락: ["1946-05-01", "1946-10-31"]
    1962 급락: ["1962-03-01", "1962-06-30"]
    1973 → 74 하락장: ["1973-01-01", "1974-10-31"]
    1987 폭락: ["1987-08-01", "1987-12-31"]
    1990 걸프전: ["1990-07-01", "1990-10-31"]
    1998 LTCM: ["1998-07-01", "1998-10-31"]
    2000 → 02 닷컴: ["2000-03-01", "2002-10-31"]

replicate:                   # 검증 2: index_timing 과 같은 조건의 SPY 2008 → 2026
  us_dir: ../../us_data      # 환경변수 US_DATA_DIR 가 있으면 그쪽
  start: "2008-01-02"
  end: "2026-09-25"
  index_timing_metrics: ../index_timing_backtest/results/metrics.csv

checks:
  big_move: 0.10
  perturb_days: 20
  seed: 42
  hand_changes: 3
