# 지수 낙폭 줄이기 설정. 모든 값은 여기에만 둔다. 지시서 SPEC.md. 결과를 보기 전에 적었다.

data:
  us_dir: ../../us_data      # 환경변수 US_DATA_DIR 가 있으면 그쪽
  kr_dir: ../../krx_data     # 환경변수 KRX_DATA_DIR 가 있으면 그쪽
  start: "2008-01-02"        # 곡선 첫날(이날 시가에 처음 산다)
  split: "2016-12-31"        # 전반 끝. 후반은 다음 날부터

markets:
  US:
    name: 미국 SPY
    end: "2026-09-25"        # 봉인선
    cost: 0.0012             # 편도: 수수료 0.07% + 슬리피지 0.05%
    dividend: null           # SPY 는 배당 반영 가격을 쓴다
  KR:
    name: 한국 코스피
    end: "2026-09-23"
    cost: 0.0002             # 편도: 수수료 0.015% + 슬리피지 0.005% (bnf park.kr_costs, ETF 매도세 없음)
    dividend: 0.017          # 코스피 가격 지수에 더하는 연 배당 근사
    dividend_sens: [0.0, 0.027]

rules:                       # 문헌 기본값. main = 판정, neighbors = 이웃(기준 5)
  T1: {name: 200일선, main: 200, neighbors: [150, 250]}
  T2: {name: 10개월선, main: 10, neighbors: [8, 12]}
  T3: {name: 변동성 목표, main: 0.15, neighbors: [0.12, 0.18], vol_window: 20, band: 0.10}

pass:
  mdd_ratio: 0.70            # 기준 1: 최대 낙폭이 보유의 이 비율 이하
  cagr_gap: 0.015            # 기준 2: 보유보다 이만큼 넘게 낮으면 안 된다
  half_cagr_gap: 0.03        # 기준 4: 전반·후반 각각
  trades_per_year: 12        # 기준 6

stress:                      # 큰 하락 구간. 구간 낙폭과, 구간 첫날부터 끝난 뒤 63거래일까지의 수익을 본다
  after_days: 63
  windows:
    2008 금융위기: ["2008-01-02", "2009-03-31"]
    2011-08 급락: ["2011-07-01", "2011-10-31"]
    2018 4분기: ["2018-10-01", "2018-12-31"]
    2020-03 코로나: ["2020-02-15", "2020-04-30"]
    2022 하락장: ["2022-01-01", "2022-12-31"]
    2024-08 급락: ["2024-07-15", "2024-08-31"]
    2026-06 → 08 급락: ["2026-06-01", "2026-08-31"]

reference:                   # 참고(판정 제외). bnf_backtest README 걸어가며 검증 표에서 옮겼다
  bnf_walkforward: "bnf 걸어가며 검증(2011년부터, 코스피 동반급락 계좌): 연 +8.0%, 최대 낙폭 -29%. 같은 기간 코스피 보유 연 +8.1%, -44%."

checks:
  perturb_days: 20
  seed: 42
  hand_changes: 3
