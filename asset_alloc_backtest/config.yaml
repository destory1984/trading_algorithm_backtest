# 여러 자산 배분 설정. 모든 값은 여기에만 둔다. 지시서 SPEC.md. 결과를 보기 전에 적었다.

data:
  us_dir: ../../us_data      # 환경변수 US_DATA_DIR 가 있으면 그쪽
  tickers: [SPY, EFA, EEM, TLT, GLD]
  start: "2008-05-01"        # 곡선 첫날(이날 시가에 처음 산다)
  end: "2026-09-25"          # 봉인선
  split: "2016-12-31"        # 전반 끝. 후반은 다음 날부터

cost: 0.0012                 # 편도: 수수료 0.07% + 슬리피지 0.05%, 바뀐 비중만큼
cash: 0.0                    # 판정용 현금 연 수익
cash_sens: [0.018]           # 민감도(판정 제외): 2008 → 2026 미국 3개월 국채 평균 근사

rules:                       # 문헌 기본값. main = 판정, neighbors = 이웃(기준 5)
  A1: {name: 이중 모멘텀, main: 12, neighbors: [9, 15]}
  A2: {name: 10개월선 5자산, main: 10, neighbors: [8, 12]}
  A3: {name: 상위 2개, main: 12, neighbors: [9, 15], top: 2}

baselines:                   # 매월 다시 맞추는 고정 비중. SPY 는 보유와 같다
  SPY: {name: SPY 보유, weights: {SPY: 1.0}}
  EW5: {name: 5종목 동일 비중, weights: {SPY: 0.2, EFA: 0.2, EEM: 0.2, TLT: 0.2, GLD: 0.2}}
  "6040": {name: SPY 60 / TLT 40 (참고), weights: {SPY: 0.6, TLT: 0.4}}

pass:
  sharpe_gap: 0.10           # 기준 2: EW5 보다 이만큼 이상 높다
  mdd_ratio: 0.50            # 기준 3: 최대 낙폭이 SPY 의 이 비율 이하
  cost_drag: 0.010           # 기준 6: 비용으로 빠지는 연 수익률 한도

dsr:
  trials: 27                 # 이 폴더 9 + index_timing 18

stress:
  windows:
    2008 금융위기: ["2008-09-01", "2009-03-31"]
    2011-08 급락: ["2011-07-01", "2011-10-31"]
    2013 테이퍼: ["2013-05-01", "2013-06-30"]
    2018 4분기: ["2018-10-01", "2018-12-31"]
    2020 코로나: ["2020-02-01", "2020-03-31"]
    2022 하락장: ["2022-01-01", "2022-12-31"]
    2025 관세: ["2025-02-01", "2025-04-30"]

checks:
  perturb_days: 20
  seed: 42
  hand_changes: 3
